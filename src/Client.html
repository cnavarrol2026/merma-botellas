<script>
  const state = {
    botellas: [],
    catalogoCompleto: [],
    temp: { items: [], zona5: 0, formatos: [], bloqueo: {} },
    pollingMs: 30000,
    saving: false,
    currentRecord: null,
    currentTempEditId: null,
    tempPollingId: null,
    tempRefreshInFlight: false,
    reportFilterTimer: null,
    dashboardFilterTimer: null,
    charts: {
      trend: null,
      bottle: null
    }
  };

  const $ = (selector) => document.querySelector(selector);

  function callApi(name, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((response) => {
          if (!response || !response.ok) {
            reject(new Error(response && response.error ? response.error : 'Error desconocido'));
            return;
          }
          resolve(response.data);
        })
        .withFailureHandler((error) => {
          const message = error && error.message ? error.message : JSON.stringify(error || {});
          reject(new Error(message || 'Error desconocido'));
        })[name](...args);
    });
  }

  function toast(message, isError = false) {
    const el = $('#toast');
    el.textContent = message;
    el.style.background = isError ? 'var(--danger)' : 'var(--text)';
    el.classList.add('show');
    window.setTimeout(() => el.classList.remove('show'), 3600);
  }

  function setButtonBusy(selector, isBusy, busyText) {
    const button = $(selector);
    if (!button) return;
    if (!button.dataset.defaultText) {
      button.dataset.defaultText = button.textContent;
    }
    button.disabled = isBusy;
    button.textContent = isBusy ? busyText : button.dataset.defaultText;
    button.classList.toggle('is-busy', isBusy);
  }

  function formatNumber(value) {
    return Number(value || 0).toLocaleString('es-CL', { maximumFractionDigits: 2 });
  }

  function parseIntegerInput(value) {
    const text = String(value || '').trim();
    if (!text) return NaN;
    const clean = text.replace(/\./g, '').replace(/\s/g, '');
    if (!/^\d+$/.test(clean)) return NaN;
    return Number(clean);
  }

  function formatDate(value) {
    if (!value) return '';
    const text = String(value);
    const localMatch = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (localMatch) {
      return new Date(Number(localMatch[1]), Number(localMatch[2]) - 1, Number(localMatch[3])).toLocaleDateString('es-CL');
    }
    const date = new Date(value);
    return date.toLocaleDateString('es-CL');
  }

  function formatTime(value) {
    if (!value) return '';
    const date = new Date(value);
    return date.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
  }

  function cssVar(name) {
    return getComputedStyle(document.body).getPropertyValue(name).trim();
  }

  function currentYear() {
    return new Date().getFullYear();
  }

  function openDatePicker(input) {
    if (input && typeof input.showPicker === 'function') {
      try {
        input.showPicker();
      } catch (error) {
        // The native picker can only open from a direct user action in some browsers.
      }
    }
  }

  function normalizeWeekRange(prefix) {
    const from = $('#' + prefix + 'SemanaDesde');
    const to = $('#' + prefix + 'SemanaHasta');
    const year = $('#' + prefix + 'SemanaAnio');
    if (!year.value) year.value = String(currentYear());
    if (from.value && !to.value) to.value = from.value;
    if (from.value && to.value && Number(to.value) < Number(from.value)) {
      to.value = from.value;
    }
  }

  function clearWeekFilters(prefix) {
    $('#' + prefix + 'SemanaDesde').value = '';
    $('#' + prefix + 'SemanaHasta').value = '';
  }

  function clearDateFilters(prefix) {
    $('#' + prefix + 'Desde').value = '';
    $('#' + prefix + 'Hasta').value = '';
  }

  function hasWeekFilters(prefix) {
    return Boolean($('#' + prefix + 'SemanaDesde').value || $('#' + prefix + 'SemanaHasta').value);
  }

  function buildFilters(prefix, includeBottle) {
    normalizeWeekRange(prefix);
    const filters = {
      desde: $('#' + prefix + 'Desde').value,
      hasta: $('#' + prefix + 'Hasta').value,
      semanaAnio: $('#' + prefix + 'SemanaAnio').value,
      semanaDesde: $('#' + prefix + 'SemanaDesde').value,
      semanaHasta: $('#' + prefix + 'SemanaHasta').value
    };
    if (includeBottle) {
      filters.codigoBotella = $('#reportCodigo').value;
    }
    return filters;
  }

  function debounceFilter(key, callback) {
    if (state[key]) window.clearTimeout(state[key]);
    state[key] = window.setTimeout(callback, 650);
  }

  function setThemeAuto() {
    const hour = new Date().getHours();
    document.body.classList.toggle('dark', hour < 7 || hour >= 20);
  }

  function renderBotellas() {
    renderBottleMatches('');
    $('#reportCodigo').innerHTML = '<option value="">Todas</option>' + state.botellas
      .map((item) => `<option value="${item.codigo}">${item.codigo}</option>`)
      .join('');
  }

  function renderBottleSelectOptions(selectedCode) {
    const hasSelected = state.botellas.some((item) => item.codigo === selectedCode);
    const fallback = selectedCode && !hasSelected
      ? `<option value="${selectedCode}">${selectedCode}</option>`
      : '';
    return fallback + state.botellas
      .map((item) => `
        <option value="${item.codigo}" ${item.codigo === selectedCode ? 'selected' : ''}>
          ${item.codigo} - ${item.descripcion}
        </option>
      `)
      .join('');
  }

  function normalizeSearch(value) {
    return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function renderBottleMatches(query) {
    const normalized = normalizeSearch(query);
    const matches = state.botellas
      .filter((item) => {
        const haystack = normalizeSearch(`${item.codigo} ${item.descripcion}`);
        return !normalized || haystack.includes(normalized);
      })
      .slice(0, 12);

    $('#botellaResults').innerHTML = matches.length
      ? matches.map((item) => `
        <button type="button" class="combo-option" data-bottle-code="${item.codigo}" data-bottle-label="${item.codigo} - ${item.descripcion}">
          <strong>${item.codigo}</strong>
          <span>${item.descripcion}</span>
        </button>
      `).join('')
      : '<div class="combo-option"><span>Sin coincidencias</span></div>';
  }

  function openBottleResults() {
    $('#botellaResults').classList.add('is-open');
  }

  function closeBottleResults() {
    window.setTimeout(() => $('#botellaResults').classList.remove('is-open'), 120);
  }

  function selectedBottleCode() {
    const hidden = $('#botellaCodigo').value;
    if (hidden) return hidden;
    const typed = $('#botellaSearch').value.trim();
    const exact = state.botellas.find((item) => `${item.codigo} - ${item.descripcion}` === typed || item.codigo === typed);
    return exact ? exact.codigo : typed;
  }

  function renderFormatos() {
    const selectedFormato = $('#formato').value;
    const selectedTempEditFormato = $('#tempEditFormato').value;
    const formatoValues = state.temp.formatos.map(String);
    const options = state.temp.formatos
      .map((formato) => `<option value="${formato}">${formato}</option>`)
      .join('');
    $('#formato').innerHTML = options;
    $('#tempEditFormato').innerHTML = options;
    if (selectedFormato && formatoValues.includes(String(selectedFormato))) {
      $('#formato').value = selectedFormato;
    }
    if (selectedTempEditFormato && formatoValues.includes(String(selectedTempEditFormato))) {
      $('#tempEditFormato').value = selectedTempEditFormato;
    }
    $('#formatosInput').value = state.temp.formatos.join(',');
  }

  function renderTemp() {
    const temp = state.temp;
    $('#zona5').textContent = formatNumber(temp.zona5);
    $('#tempRows').innerHTML = temp.items.length
      ? temp.items.map((item) => `
        <tr>
          <td>${item.codigoBotella}</td>
          <td>${item.codigoProduccion}</td>
          <td>${item.formato}</td>
          <td>${item.cantidadCajas}</td>
          <td>${formatNumber(item.totalBotellas)}</td>
          <td>
            <div class="row-actions">
              <button data-edit-temp="${item.id}">Editar</button>
              <button class="danger" data-delete-temp="${item.id}">Eliminar</button>
            </div>
          </td>
        </tr>
      `).join('')
      : '<tr><td colspan="6" class="muted">Sin líneas temporales.</td></tr>';
  }

  function renderCatalogo() {
    const query = normalizeSearch($('#catalogSearch') ? $('#catalogSearch').value : '');
    const rows = state.catalogoCompleto.filter((item) => {
      const haystack = normalizeSearch(`${item.codigo} ${item.descripcion} ${item.estado}`);
      return !query || haystack.includes(query);
    });
    if ($('#catalogCount')) {
      $('#catalogCount').textContent = `${rows.length} de ${state.catalogoCompleto.length} botellas`;
    }
    $('#catalogRows').innerHTML = rows.length
      ? rows.map((item) => `
        <tr>
          <td>${item.codigo}</td>
          <td>${item.descripcion}</td>
          <td>${item.estado}</td>
          <td>
            <div class="row-actions">
              <button data-edit-bottle="${item.codigo}">Editar</button>
              <button data-toggle-bottle="${item.codigo}" data-next="${item.estado === 'ACTIVO' ? 'INACTIVO' : 'ACTIVO'}">
                ${item.estado === 'ACTIVO' ? 'Desactivar' : 'Reactivar'}
              </button>
            </div>
          </td>
        </tr>
      `).join('')
      : '<tr><td colspan="4" class="muted">Sin botellas coincidentes.</td></tr>';
  }

  function renderDashboard(data) {
    const totals = data.totals;
    $('#kpiZona1').textContent = formatNumber(totals.zona1);
    $('#kpiZona5').textContent = formatNumber(totals.zona5);
    $('#kpiMerma').textContent = formatNumber(totals.merma);
    $('#kpiPct').textContent = `${formatNumber(totals.porcentajeMerma)}%`;
    $('#kpiRegistros').textContent = formatNumber(totals.cantidadRegistros);
    renderDashboardCharts(data);
  }

  function ensureDashboardCharts() {
    if (!window.echarts) return false;
    if (!state.charts.trend) {
      state.charts.trend = echarts.init($('#mermaTrendChart'));
    }
    if (!state.charts.bottle) {
      state.charts.bottle = echarts.init($('#mermaBottleChart'));
    }
    return true;
  }

  function renderDashboardCharts(data) {
    if (!ensureDashboardCharts()) return;
    const textColor = cssVar('--text');
    const mutedColor = cssVar('--muted');
    const lineColor = cssVar('--line');
    const primaryColor = cssVar('--primary');
    const warningColor = cssVar('--warning');
    const trend = data.byDate || [];
    const bottle = (data.grouped || []).slice(0, 10);
    const emptyGraphic = {
      type: 'text',
      left: 'center',
      top: 'middle',
      style: {
        text: 'Sin datos para el filtro seleccionado',
        fill: mutedColor,
        fontSize: 14,
        fontWeight: 700
      }
    };

    state.charts.trend.setOption({
      color: [warningColor, primaryColor],
      tooltip: { trigger: 'axis' },
      legend: { textStyle: { color: mutedColor } },
      grid: { left: 48, right: 24, top: 44, bottom: 48 },
      xAxis: {
        type: 'category',
        data: trend.map((item) => formatDate(item.fecha)),
        axisLabel: { color: mutedColor },
        axisLine: { lineStyle: { color: lineColor } }
      },
      yAxis: [
        {
          type: 'value',
          name: 'Merma',
          axisLabel: { color: mutedColor },
          splitLine: { lineStyle: { color: lineColor } }
        },
        {
          type: 'value',
          name: '%',
          axisLabel: { color: mutedColor, formatter: '{value}%' },
          splitLine: { show: false }
        }
      ],
      series: [
        {
          name: 'Merma',
          type: 'bar',
          data: trend.map((item) => item.merma)
        },
        {
          name: '% merma',
          type: 'line',
          smooth: true,
          yAxisIndex: 1,
          data: trend.map((item) => Number(item.porcentajeMerma || 0).toFixed(2))
        }
      ],
      graphic: trend.length ? [] : emptyGraphic,
      textStyle: { color: textColor }
    }, { replaceMerge: ['graphic'] });

    state.charts.bottle.setOption({
      color: [primaryColor],
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: 130, right: 24, top: 24, bottom: 38 },
      xAxis: {
        type: 'value',
        axisLabel: { color: mutedColor },
        splitLine: { lineStyle: { color: lineColor } }
      },
      yAxis: {
        type: 'category',
        data: bottle.map((item) => item.codigoBotella),
        axisLabel: { color: mutedColor },
        axisLine: { lineStyle: { color: lineColor } }
      },
      series: [{
        name: 'Merma',
        type: 'bar',
        data: bottle.map((item) => item.merma)
      }],
      graphic: bottle.length ? [] : emptyGraphic,
      textStyle: { color: textColor }
    }, { replaceMerge: ['graphic'] });
  }

  function renderReport(data) {
    const totals = data.totals;
    $('#reportSummary').textContent =
      `Zona 1: ${formatNumber(totals.zona1)} | Zona 5: ${formatNumber(totals.zona5)} | ` +
      `Merma: ${formatNumber(totals.merma)} | %: ${formatNumber(totals.porcentajeMerma)} | ` +
      `Registros: ${formatNumber(totals.cantidadRegistros)}`;
    $('#reportRows').innerHTML = data.rows.length
      ? data.rows.map((row) => `
        <tr data-registro="${row.ID_REGISTRO}">
          <td>${row.SEMANA || ''}</td>
          <td>${formatDate(row.FECHA_HORA)}</td>
          <td>${formatTime(row.FECHA_HORA)}</td>
          <td>${row.CODIGO_BOTELLA}</td>
          <td>${row.DESCRIPCION_BOTELLA}</td>
          <td>${formatNumber(row.ZONA_1)}</td>
          <td>${formatNumber(row.ZONA_5)}</td>
          <td>${formatNumber(row.MERMA)}</td>
          <td>${formatNumber(row.PORCENTAJE_MERMA)}%</td>
          <td><button data-open-record="${row.ID_REGISTRO}">Abrir</button></td>
        </tr>
      `).join('')
      : '<tr><td colspan="10" class="muted">Sin resultados.</td></tr>';
  }

  function renderDetailEditor(item = {}) {
    const id = item.ID_DETALLE || '';
    return `
      <div class="edit-detail-row" data-detail-id="${id}">
        <label>Código producción
          <input class="editCodigoProduccion" value="${item.CODIGO_PRODUCCION || ''}">
        </label>
        <label>Formato
          <select class="editFormato">
            ${state.temp.formatos.map((formato) => `
              <option value="${formato}" ${Number(item.FORMATO || formato) === Number(formato) ? 'selected' : ''}>${formato}</option>
            `).join('')}
          </select>
        </label>
        <label>Cajas
          <input class="editCantidadCajas" type="number" min="0" step="1" value="${item.CANTIDAD_CAJAS || 0}">
        </label>
        <button type="button" class="danger" data-remove-detail>Quitar</button>
      </div>
    `;
  }

  function renderRecordDialog(data) {
    state.currentRecord = data;
    const registro = data.registro;
    const detalles = data.detalles.filter((item) => item.ESTADO !== 'ELIMINADO');
    $('#recordBody').innerHTML = `
      <div class="detail-grid">
        <label>Código botella
          <select id="editCodigoBotella">
            ${state.botellas.map((item) => `
              <option value="${item.codigo}" ${item.codigo === registro.CODIGO_BOTELLA ? 'selected' : ''}>
                ${item.codigo} - ${item.descripcion}
              </option>
            `).join('')}
          </select>
        </label>
        <label>Zona 1
          <input id="editZona1" type="number" min="0" step="1" value="${registro.ZONA_1}">
        </label>
        <label>Motivo
          <input id="editMotivo" placeholder="Motivo obligatorio">
        </label>
      </div>
      <div id="editDetails">
        ${detalles.map(renderDetailEditor).join('')}
      </div>
      <button type="button" id="addEditDetail">Agregar línea</button>
      <p class="muted">Las líneas quitadas se marcan como ELIMINADO al guardar.</p>
    `;
    $('#recordDialog').showModal();
  }

  async function loadDashboardDataFromFilters() {
    setButtonBusy('#loadDashboard', true, 'Actualizando...');
    try {
      renderDashboard(await callApi('apiGetDashboard', buildFilters('dash', false)));
    } catch (error) {
      toast(error.message, true);
    } finally {
      setButtonBusy('#loadDashboard', false);
    }
  }

  async function loadReportDataFromFilters() {
    setButtonBusy('#loadReport', true, 'Buscando...');
    try {
      renderReport(await callApi('apiGetReport', buildFilters('report', true)));
    } catch (error) {
      toast(error.message, true);
    } finally {
      setButtonBusy('#loadReport', false);
    }
  }

  function initializeFilters() {
    $('#dashSemanaAnio').value = String(currentYear());
    $('#reportSemanaAnio').value = String(currentYear());
  }

  async function refreshTemp(silent = true) {
    if (state.tempRefreshInFlight || document.hidden || !$('#registro').classList.contains('is-active')) return;
    state.tempRefreshInFlight = true;
    try {
      state.temp = await callApi('apiGetTempState');
      renderTemp();
      renderFormatos();
    } catch (error) {
      if (!silent) toast(error.message, true);
    } finally {
      state.tempRefreshInFlight = false;
    }
  }

  async function bootstrap() {
    try {
      const data = await callApi('apiBootstrap');
      $('#companyName').textContent = data.empresa;
      state.pollingMs = data.pollingMs;
      state.botellas = data.botellas;
      state.catalogoCompleto = data.catalogoCompleto;
      state.temp = data.temp;
      initializeFilters();
      renderBotellas();
      renderFormatos();
      renderTemp();
      renderCatalogo();
      renderDashboard(data.dashboard);
      if (state.tempPollingId) {
        window.clearInterval(state.tempPollingId);
      }
      state.tempPollingId = window.setInterval(() => refreshTemp(true), state.pollingMs);
    } catch (error) {
      toast(error.message, true);
    }
  }

  document.addEventListener('click', async (event) => {
    const tab = event.target.closest('[data-tab]');
    if (tab) {
      document.querySelectorAll('.tab, .view').forEach((el) => el.classList.remove('is-active'));
      tab.classList.add('is-active');
      $('#' + tab.dataset.tab).classList.add('is-active');
      if (tab.dataset.tab === 'registro') {
        refreshTemp(true);
      }
      if (tab.dataset.tab === 'dashboard') {
        loadDashboardDataFromFilters().then(() => resizeCharts());
      }
      if (tab.dataset.tab === 'reporte') {
        loadReportDataFromFilters();
      }
      return;
    }

    const deleteTemp = event.target.closest('[data-delete-temp]');
    if (deleteTemp) {
      try {
        state.temp = await callApi('apiDeleteTempLine', deleteTemp.dataset.deleteTemp);
        renderTemp();
      toast('Línea eliminada.');
      } catch (error) {
        toast(error.message, true);
      }
      return;
    }

    const editTemp = event.target.closest('[data-edit-temp]');
    if (editTemp) {
      const item = state.temp.items.find((line) => line.id === editTemp.dataset.editTemp);
      if (!item) return;
      state.currentTempEditId = item.id;
      $('#tempEditCodigoBotella').innerHTML = renderBottleSelectOptions(item.codigoBotella);
      $('#tempEditCodigoProduccion').value = item.codigoProduccion;
      $('#tempEditFormato').value = item.formato;
      $('#tempEditCantidadCajas').value = formatNumber(item.cantidadCajas);
      $('#tempEditDialog').showModal();
      return;
    }

    const editBottle = event.target.closest('[data-edit-bottle]');
    if (editBottle) {
      const item = state.catalogoCompleto.find((row) => row.codigo === editBottle.dataset.editBottle);
      if (!item) return;
      $('#catalogCodigo').value = item.codigo;
      $('#catalogDescripcion').value = item.descripcion;
      return;
    }

    const toggleBottle = event.target.closest('[data-toggle-bottle]');
    if (toggleBottle) {
      try {
        state.catalogoCompleto = await callApi(
          'apiSetBotellaEstado',
          toggleBottle.dataset.toggleBottle,
          toggleBottle.dataset.next
        );
        state.botellas = state.catalogoCompleto.filter((row) => row.estado === 'ACTIVO');
        renderBotellas();
        renderCatalogo();
        toast('Estado actualizado.');
      } catch (error) {
        toast(error.message, true);
      }
      return;
    }

    const bottleOption = event.target.closest('[data-bottle-code]');
    if (bottleOption) {
      $('#botellaCodigo').value = bottleOption.dataset.bottleCode;
      $('#botellaSearch').value = bottleOption.dataset.bottleLabel;
      $('#botellaResults').classList.remove('is-open');
      return;
    }

    const openRecord = event.target.closest('[data-open-record]');
    if (openRecord) {
      try {
        renderRecordDialog(await callApi('apiGetRegistro', openRecord.dataset.openRecord));
      } catch (error) {
        toast(error.message, true);
      }
      return;
    }

    if (event.target.closest('[data-remove-detail]')) {
      event.target.closest('.edit-detail-row').remove();
      return;
    }

    if (event.target.id === 'addEditDetail') {
      $('#editDetails').insertAdjacentHTML('beforeend', renderDetailEditor());
    }
  });

  $('#themeToggle').addEventListener('click', () => {
    document.body.classList.toggle('dark');
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      refreshTemp(true);
      resizeCharts();
    }
  });

  function resizeCharts() {
    window.setTimeout(() => {
      if (state.charts.trend) state.charts.trend.resize();
      if (state.charts.bottle) state.charts.bottle.resize();
    }, 80);
  }

  ['dashDesde', 'dashHasta', 'reportDesde', 'reportHasta'].forEach((id) => {
    const input = $('#' + id);
    input.addEventListener('click', () => openDatePicker(input));
    input.addEventListener('change', () => {
      clearWeekFilters(id.indexOf('dash') === 0 ? 'dash' : 'report');
      if (id.indexOf('dash') === 0) {
        debounceFilter('dashboardFilterTimer', loadDashboardDataFromFilters);
      } else {
        debounceFilter('reportFilterTimer', loadReportDataFromFilters);
      }
    });
  });

  ['dashSemanaAnio', 'dashSemanaDesde', 'dashSemanaHasta'].forEach((id) => {
    $('#' + id).addEventListener('change', () => {
      normalizeWeekRange('dash');
      if (hasWeekFilters('dash')) {
        clearDateFilters('dash');
      }
      debounceFilter('dashboardFilterTimer', loadDashboardDataFromFilters);
    });
  });

  ['reportSemanaAnio', 'reportSemanaDesde', 'reportSemanaHasta', 'reportCodigo'].forEach((id) => {
    $('#' + id).addEventListener('change', () => {
      if (id.indexOf('Semana') !== -1) {
        normalizeWeekRange('report');
        if (hasWeekFilters('report')) {
          clearDateFilters('report');
        }
      }
      debounceFilter('reportFilterTimer', loadReportDataFromFilters);
    });
  });

  window.addEventListener('resize', resizeCharts);

  $('#botellaSearch').addEventListener('input', () => {
    $('#botellaCodigo').value = '';
    renderBottleMatches($('#botellaSearch').value);
    openBottleResults();
  });

  $('#botellaSearch').addEventListener('focus', () => {
    renderBottleMatches($('#botellaSearch').value);
    openBottleResults();
  });

  $('#botellaSearch').addEventListener('blur', closeBottleResults);

  $('#catalogSearch').addEventListener('input', renderCatalogo);

  $('#setupWorkbook').addEventListener('click', async () => {
    try {
      const result = await callApi('apiSetupWorkbook');
      toast(result);
      await bootstrap();
    } catch (error) {
      toast(error.message, true);
    }
  });

  $('#saveFormatos').addEventListener('click', async () => {
    try {
      const values = $('#formatosInput').value
        .split(',')
        .map((value) => value.trim())
        .filter(Boolean)
        .map(Number);
      state.temp.formatos = await callApi('apiSaveFormatos', values);
      renderFormatos();
      toast('Formatos actualizados.');
    } catch (error) {
      toast(error.message, true);
    }
  });

  $('#addLine').addEventListener('click', async () => {
    setButtonBusy('#addLine', true, 'Agregando...');
    try {
      state.temp = await callApi('apiAddTempLine', {
        codigoBotella: selectedBottleCode(),
        codigoProduccion: $('#codigoProduccion').value,
        formato: $('#formato').value,
        cantidadCajas: $('#cantidadCajas').value
      });
      $('#codigoProduccion').value = '';
      $('#cantidadCajas').value = '0';
      renderTemp();
      toast('Línea agregada.');
    } catch (error) {
      toast(error.message, true);
    } finally {
      setButtonBusy('#addLine', false);
    }
  });

  $('#saveTempEdit').addEventListener('click', async (event) => {
    event.preventDefault();
    if (!state.currentTempEditId) return;
    try {
      state.temp = await callApi('apiUpdateTempLine', state.currentTempEditId, {
        codigoBotella: $('#tempEditCodigoBotella').value,
        codigoProduccion: $('#tempEditCodigoProduccion').value,
        formato: $('#tempEditFormato').value,
        cantidadCajas: parseIntegerInput($('#tempEditCantidadCajas').value)
      });
      $('#tempEditDialog').close();
      state.currentTempEditId = null;
      renderTemp();
      toast('Línea actualizada.');
    } catch (error) {
      toast(error.message, true);
    }
  });

  $('#cancelTemp').addEventListener('click', async () => {
    if (!confirm('Cancelar la merma en curso limpiara la lista temporal.')) return;
    try {
      state.temp = await callApi('apiCancelTempList');
      $('#zona1').value = '0';
      renderTemp();
      toast('Merma cancelada.');
    } catch (error) {
      toast(error.message, true);
    }
  });

  $('#previewSave').addEventListener('click', () => {
    setButtonBusy('#previewSave', true, 'Preparando...');
    const zona1 = parseIntegerInput($('#zona1').value);
    const zona5 = Number(state.temp.zona5 || 0);
    if (!Number.isInteger(zona1) || zona1 < 0) {
      toast('Zona 1 debe ser un entero mayor o igual a cero.', true);
      setButtonBusy('#previewSave', false);
      return;
    }
    if (zona5 > zona1) {
      toast('Zona 5 no puede ser mayor que Zona 1.', true);
      setButtonBusy('#previewSave', false);
      return;
    }
    const merma = zona1 - zona5;
    const pct = zona1 === 0 ? 0 : (merma / zona1) * 100;
    $('#confirmBody').innerHTML = `
      <p>Zona 1: <strong>${formatNumber(zona1)}</strong></p>
      <p>Zona 5: <strong>${formatNumber(zona5)}</strong></p>
      <p>Merma: <strong>${formatNumber(merma)}</strong></p>
      <p>% de merma: <strong>${formatNumber(pct)}%</strong></p>
    `;
    $('#confirmDialog').showModal();
    setButtonBusy('#previewSave', false);
  });

  $('#saveRegistro').addEventListener('click', async (event) => {
    event.preventDefault();
    if (state.saving) return;
    state.saving = true;
    setButtonBusy('#saveRegistro', true, 'Guardando...');
    setButtonBusy('#previewSave', true, 'Guardando...');
    try {
      await callApi('apiSaveRegistro', { zona1: parseIntegerInput($('#zona1').value) });
      $('#confirmDialog').close();
      $('#zona1').value = '0';
      state.temp = await callApi('apiGetTempState');
      renderTemp();
      renderDashboard(await callApi('apiGetDashboard', {}));
      toast('Registro guardado correctamente.');
    } catch (error) {
      toast(error.message, true);
    } finally {
      state.saving = false;
      setButtonBusy('#saveRegistro', false);
      setButtonBusy('#previewSave', false);
    }
  });

  $('#saveBottle').addEventListener('click', async () => {
    try {
      state.catalogoCompleto = await callApi('apiSaveBotella', {
        codigo: $('#catalogCodigo').value,
        descripcion: $('#catalogDescripcion').value
      });
      state.botellas = state.catalogoCompleto.filter((row) => row.estado === 'ACTIVO');
      $('#catalogCodigo').value = '';
      $('#catalogDescripcion').value = '';
      renderBotellas();
      renderCatalogo();
      toast('Botella guardada.');
    } catch (error) {
      toast(error.message, true);
    }
  });

  $('#loadDashboard').addEventListener('click', loadDashboardDataFromFilters);

  $('#loadReport').addEventListener('click', loadReportDataFromFilters);

  $('#printReport').addEventListener('click', () => window.print());

  $('#showDeleted').addEventListener('click', async () => {
    try {
      const rows = await callApi('apiGetDeletedRecords');
      $('#deletedRows').innerHTML = rows.length
        ? rows.map((row) => `
          <tr>
            <td>${formatDate(row.FECHA_ELIMINACION)}</td>
            <td>${row.CODIGO_BOTELLA}</td>
            <td>${formatNumber(row.ZONA_1)}</td>
            <td>${formatNumber(row.ZONA_5)}</td>
            <td><button data-restore="${row.ID_REGISTRO}">Restaurar</button></td>
          </tr>
        `).join('')
        : '<tr><td colspan="5" class="muted">Sin eliminados.</td></tr>';
      $('#deletedDialog').showModal();
    } catch (error) {
      toast(error.message, true);
    }
  });

  $('#deletedRows').addEventListener('click', async (event) => {
    const restore = event.target.closest('[data-restore]');
    if (!restore) return;
    const motivo = prompt('Motivo de restauración');
    if (!motivo) return;
    try {
      await callApi('apiRestoreRegistro', restore.dataset.restore, motivo);
      toast('Registro restaurado.');
      $('#deletedDialog').close();
    } catch (error) {
      toast(error.message, true);
    }
  });

  $('#deleteRegistro').addEventListener('click', async (event) => {
    event.preventDefault();
    if (!state.currentRecord) return;
    const motivo = prompt('Motivo de eliminación');
    if (!motivo) return;
    try {
      await callApi('apiDeleteRegistro', state.currentRecord.registro.ID_REGISTRO, motivo);
      $('#recordDialog').close();
      toast('Registro eliminado.');
      renderReport(await callApi('apiGetReport', {
        desde: $('#reportDesde').value,
        hasta: $('#reportHasta').value,
        codigoBotella: $('#reportCodigo').value
      }));
      renderDashboard(await callApi('apiGetDashboard', {}));
    } catch (error) {
      toast(error.message, true);
    }
  });

  $('#updateRegistro').addEventListener('click', async (event) => {
    event.preventDefault();
    if (!state.currentRecord) return;
    const detalles = Array.from(document.querySelectorAll('.edit-detail-row')).map((row) => ({
      idDetalle: row.dataset.detailId,
      codigoProduccion: row.querySelector('.editCodigoProduccion').value,
      formato: row.querySelector('.editFormato').value,
      cantidadCajas: row.querySelector('.editCantidadCajas').value
    }));
    try {
      await callApi('apiUpdateRegistro', {
        idRegistro: state.currentRecord.registro.ID_REGISTRO,
        codigoBotella: $('#editCodigoBotella').value,
        zona1: $('#editZona1').value,
        motivo: $('#editMotivo').value,
        detalles
      });
      $('#recordDialog').close();
      toast('Registro modificado.');
      renderReport(await callApi('apiGetReport', {
        desde: $('#reportDesde').value,
        hasta: $('#reportHasta').value,
        codigoBotella: $('#reportCodigo').value
      }));
      renderDashboard(await callApi('apiGetDashboard', {}));
    } catch (error) {
      toast(error.message, true);
    }
  });

  setThemeAuto();
  bootstrap();
</script>
